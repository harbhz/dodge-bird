<!DOCTYPE html>
<html lang="en">
<head>
    <title>Dodge Bird | Neon Flight</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#07111f">
    <meta name="description" content="Dodge Bird is a fast, touch-friendly arcade flight challenge.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #07111f;
            font-family: Georgia, 'Times New Roman', serif;
            touch-action: none;
        }
        
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 18px;
            box-shadow: 0 18px 70px rgba(0, 0, 0, 0.48), 0 0 0 1px rgba(255,255,255,0.12);
            touch-action: none;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
    </style>
</head>
<body>
<script src="/dist/game.js"></script>

</body>
</html>
